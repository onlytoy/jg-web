<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Mobile Japan — サイト一覧</title>
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: linear-gradient(135deg, #0b1220 0%, #142033 60%, #1b2b45 100%);
    color: #eef2f8;
  }
  header { text-align: center; margin-bottom: 48px; }
  header h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 700; letter-spacing: -0.02em; }
  header p { margin-top: 12px; color: #9fb0c8; font-size: 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    width: 100%;
    max-width: 860px;
  }
  a.card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 16px;
    padding: 28px;
    transition: transform .18s ease, border-color .18s ease, background .18s ease;
  }
  a.card:hover {
    transform: translateY(-4px);
    border-color: rgba(120,170,255,0.55);
    background: rgba(255,255,255,0.08);
  }
  .card .tag { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #7fa8e0; }
  .card h2 { font-size: 20px; margin: 10px 0 8px; font-weight: 600; }
  .card p { color: #9fb0c8; font-size: 14px; line-height: 1.6; }
  .card .go { margin-top: 18px; font-size: 14px; color: #8ec0ff; font-weight: 600; }
  footer { margin-top: 48px; color: #6b7c95; font-size: 13px; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>Aurora Mobile Japan</h1>
    <p>サイト一覧 / Site Directory</p>
  </header>
  <div class="grid">
    <a class="card" href="./aurora-mobile/">
      <div class="tag">Corporate</div>
      <h2>Aurora Mobile 株式会社</h2>
      <p>AIとカスタマーエンゲージメントのグローバル・テクノロジーグループ</p>
      <div class="go">サイトを見る →</div>
    </a>
    <a class="card" href="./japan-site/">
      <div class="tag">Product</div>
      <h2>Aurora Mobile</h2>
      <p>AIと高精度なエンゲージメントで、グローバル成長を加速する。</p>
      <div class="go">サイトを見る →</div>
    </a>
  </div>
  <footer>© Aurora Mobile Japan</footer>
</body>
</html>
