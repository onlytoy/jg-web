<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Zen Kaku Gothic New",sans-serif;color:#0b1524;background:#fff;width:1440px}
a{color:#2f4bf0;text-decoration:none}
#cmp{padding:64px 0 80px;background:linear-gradient(180deg,#fff, #F7F9FF);position:relative;overflow:hidden}
#cmp:before{content:"";position:absolute;right:0;top:0;width:760px;height:100%;background-image:linear-gradient(#e9edf6 1px,transparent 1px),linear-gradient(90deg,#e9edf6 1px,transparent 1px);background-size:40px 40px;opacity:.55;-webkit-mask:radial-gradient(70% 70% at 60% 45%,#000 30%,transparent 80%);mask:radial-gradient(70% 70% at 60% 45%,#000 30%,transparent 80%)}
.wrap{position:relative;width:1152px;margin:0 auto;display:grid;grid-template-columns:540px 1fr;gap:40px;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:700;margin-bottom:22px}
.logo i{width:32px;height:32px;border-radius:8px;background:#6A4CF5;color:#fff;font-style:normal;display:grid;place-items:center;font-size:17px}
h1{font-size:36px;line-height:1.6;font-weight:700;letter-spacing:.02em}
h1 em{font-style:normal;color:#2f4bf0}
.lead{margin-top:20px;font-size:15px;line-height:2;color:#5b6475}
.btns{display:flex;gap:14px;margin-top:32px}
.b{height:52px;padding:0 24px;border-radius:26px;display:inline-flex;align-items:center;font-weight:700;font-size:15px}
.b.p{background:#2f4bf0;color:#fff;box-shadow:0 10px 24px rgba(47,75,240,.25)}
.b.s{background:#fff;border:1px solid #dfe4ee;color:#2f4bf0}
.chk{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:24px;font-size:13px;color:#5b6475}
.chk span{display:flex;align-items:center;gap:8px}
.chk span:before{content:"✓";width:18px;height:18px;border-radius:50%;background:#EEF2FF;color:#2f4bf0;font-size:10px;display:grid;place-items:center}
.vis{position:relative;height:500px}
.win{position:absolute;left:20px;top:56px;width:480px;background:#fff;border:1px solid #e6eaf2;border-radius:14px;box-shadow:0 24px 60px rgba(30,45,90,.08);overflow:hidden}
.bar{height:40px;border-bottom:1px solid #eef1f6;display:flex;align-items:center;gap:7px;padding:0 16px;font-size:12px;color:#8a94a6}
.bar i{width:9px;height:9px;border-radius:50%;background:#e3e7ef}
.bar span{margin-left:12px}
.tabs{display:flex;gap:8px;padding:14px 16px 0}
.tab{height:30px;padding:0 12px;border-radius:15px;border:1px solid #e6eaf2;font-size:12px;color:#5b6475;display:flex;align-items:center;gap:6px}
.tab.on{background:#F3F0FF;border-color:#d9d0fd;color:#4b32c9;font-weight:700}
.tab.on:before{content:"";width:6px;height:6px;border-radius:50%;background:#6A4CF5}
.img{margin:14px 16px 0;height:250px;border-radius:10px;background:#eef1f6 center/cover}
.path{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 16px;font-size:12px}
.path b{font-weight:500;color:#334155;letter-spacing:.02em}
.path span{color:#8a94a6}
.fl{position:absolute;background:#fff;border:1px solid #e6eaf2;border-radius:14px;box-shadow:0 14px 34px rgba(30,45,90,.08);padding:14px 16px}
.fl .hd{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;font-weight:700;color:#334155;margin-bottom:10px}
.fl .hd:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.rw{display:flex;justify-content:space-between;font-size:12px;color:#8a94a6;line-height:2}
.rw b{color:#0b1524;font-weight:500}
.f1{right:-10px;top:-6px;width:220px;--c:#2f4bf0}
.f2{right:-10px;bottom:10px;width:220px;--c:#22c55e}
.meter{height:6px;border-radius:3px;background:#eef1f6;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;width:42%;background:#22c55e;border-radius:3px}
.f3{left:0;bottom:6px;display:flex;align-items:center;gap:12px;padding:12px 16px}
.f3 .ic{width:34px;height:34px;border-radius:10px;background:#F3F0FF;display:grid;place-items:center;color:#6A4CF5;font-size:15px;font-weight:700}
.f3 p{font-size:13px}
.f3 small{display:block;font-size:11px;color:#8a94a6}
</style></head><body>
<div id="cmp"><div class="wrap">
<div>
<div class="logo"><i>M</i>Modellix</div>
<h1>世界のAIメディアモデルを、<br><em>ひとつのAPIで。</em></h1>
<p class="lead">画像・動画・音声・テキストの主要モデルを統合。<br>透明な料金と完全な呼び出しログで、安心して本番運用できます。</p>
<div class="btns"><a class="b p">無料で始める →</a><a class="b s">モデルを見る</a></div>
<div class="chk"><span>172以上のモデルを統合</span><span>透明な従量課金</span><span>ISO/IEC 27001・27701</span></div>
</div>
<div class="vis">
<div class="win">
<div class="bar"><i></i><i></i><i></i><span>Modellix Console</span></div>
<div class="tabs"><span class="tab on">Nano Banana</span><span class="tab">Seedream</span><span class="tab">Kling</span></div>
<div class="img" style="background-image:url(img/news-detail-main.png)"></div>
<div class="path"><b>/google/nano-banana-2</b><span>画像生成</span></div>
</div>
<div class="fl f1"><div class="hd">呼び出し詳細</div><div class="rw"><span>入力</span><b>テキスト</b></div><div class="rw"><span>出力</span><b>画像 1枚</b></div><div class="rw"><span>処理時間</span><b>4.8s</b></div><div class="rw"><span>料金</span><b>$0.04</b></div></div>
<div class="fl f2"><div class="hd">利用明細</div><div class="rw"><span>今月の利用額</span><b>$126.40</b></div><div class="meter"><i></i></div></div>
<div class="fl f3"><div class="ic">M</div><p>モデルを切り替え<small>コードはそのまま</small></p></div>
</div>
</div></div>
</body></html>
