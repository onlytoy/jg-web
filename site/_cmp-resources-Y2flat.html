<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eef1f7;font-family:"Zen Kaku Gothic New",sans-serif;color:#0b1524}
#cmp{padding:40px;width:max-content}
.row{display:grid;grid-template-columns:repeat(4,320px);gap:22px}
.t{font:500 20px/1.3 "Zen Kaku Gothic New";margin:0 0 4px}.t b{font:700 24px "JetBrains Mono";color:#3b4cf0;margin-right:10px}
.d{font-size:12.5px;color:#64748b;margin:0 0 14px}
.card{background:#fff;border:1px solid #e5e9f2;border-radius:16px;overflow:hidden}
.st{position:relative;overflow:hidden;height:300px;background-color:#f6f7fa;background-image:linear-gradient(rgba(11,21,36,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(11,21,36,.045) 1px,transparent 1px);background-size:24px 24px;}
.doc{position:absolute;right:22px;bottom:-14px;width:184px;height:260px;transform:rotate(-5deg);transform-origin:center}
.doc:before{content:"";position:absolute;left:3px;right:-3px;top:3px;bottom:-3px;background:#fff;border:1px solid #e3e7ef;border-radius:2px}
.cvr{position:absolute;inset:0;background:#fff;border:1px solid #e3e7ef;border-radius:2px;box-shadow:-14px 18px 30px -16px rgba(11,21,36,.30);overflow:hidden}
.sp{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.gr{position:absolute;inset:0;background-image:linear-gradient(90deg,rgba(11,21,36,.05) 1px,transparent 1px);background-size:43px 100%;background-position:18px 0}
.hd{position:absolute;left:18px;right:16px;top:16px;display:flex;justify-content:space-between;border-bottom:1px solid #0b1524;padding-bottom:6px;font:700 6.5px "JetBrains Mono";letter-spacing:.14em}
.mk{position:absolute;right:16px;top:38px;width:26px;height:26px}
.ft{position:absolute;left:18px;right:16px;bottom:18px}
.ft span{font:700 6.5px "JetBrains Mono";letter-spacing:.14em;color:var(--c2)}
.ft div{margin-top:5px;font:700 14px/1.45 "Zen Kaku Gothic New"}
.ft p{margin:10px 0 0;padding-top:7px;border-top:1px solid #e3e7ef;font:500 6.5px "Zen Kaku Gothic New";color:#64748b;display:flex;justify-content:space-between}
.meta{padding:16px 20px 18px}.meta i{font-style:normal;font-size:11.5px;font-weight:500;color:var(--c2)}.meta h3{margin:5px 0 0;font:500 15px/1.5 "Zen Kaku Gothic New"}
</style></head><body><div id="cmp">
<p class="t"><b>Y2D</b>タイポグラフィ × 右下に置いたA4</p><p class="d">Y2の表紙を正面向きの印刷物に。紙の厚みと薄い影のみ。類型色は背の細帯と右上の小マークだけ。</p>
<div class="row" id="row"></div></div>
<script>
const MK={blue:'<svg viewBox="0 0 26 26"><rect x="1" y="1" width="24" height="24" fill="#3b4cf0"/></svg>',
teal:'<svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="12" fill="#14b8a6"/></svg>',
purple:'<svg viewBox="0 0 26 26"><path d="M1 25V1a24 24 0 0 1 24 24z" fill="#7c5cff"/></svg>',
orange:'<svg viewBox="0 0 26 26"><path d="M4 2l20 11L4 24z" fill="#f59e0b"/></svg>'};
const D=[
{k:'blue',c:'#3b4cf0',c2:'#3b4cf0',en:'SERVICE GUIDE',ti:'EngageLab<br>サービス紹介資料',pg:'PDF ／ 18ページ',cat:'サービス資料',h:'EngageLab サービス紹介資料'},
{k:'teal',c:'#14b8a6',c2:'#0f9e8f',en:'CASE STUDIES',ti:'業界別<br>導入事例集',pg:'PDF ／ 24ページ',cat:'導入事例集',h:'業界別 導入事例集 2026'},
{k:'purple',c:'#7c5cff',c2:'#6d4cf0',en:'WHITE PAPER',ti:'プッシュ通知<br>到達率改善ガイド',pg:'PDF ／ 16ページ',cat:'ホワイトペーパー',h:'プッシュ通知 到達率改善ガイド'},
{k:'orange',c:'#f59e0b',c2:'#d97f06',en:'WEBINAR',ti:'AI時代の<br>顧客エンゲージ<br>メント戦略',pg:'動画 ／ 45分',cat:'ウェビナー',h:'AI時代の顧客エンゲージメント戦略'}];
row.innerHTML=D.map(d=>`<div class="card" style="--c:${d.c};--c2:${d.c2}"><div class="st"><div class="doc"><div class="cvr"><div class="gr"></div><div class="sp"></div><div class="hd"><span>AURORA MOBILE</span><span>2026</span></div><div class="mk">${MK[d.k]}</div><div class="ft"><span>${d.en}</span><div>${d.ti}</div><p><b style="font-weight:500">Aurora Mobile 株式会社</b><b style="font-weight:500">${d.pg}</b></p></div></div></div></div><div class="meta"><i>${d.cat}</i><h3>${d.h}</h3></div></div>`).join('');
</script></body></html>
