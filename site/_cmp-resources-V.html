<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Zen Kaku Gothic New",sans-serif;color:#0b1524;background:#e9ecf2}
#cmp{display:grid;grid-template-columns:repeat(2,640px);gap:40px 36px;padding:40px;width:max-content}
.lab{font:500 22px/1 "JetBrains Mono";color:#2f46f0;margin-bottom:6px}.lab small{font:400 15px "Zen Kaku Gothic New";color:#64748b;margin-left:10px}
.ref{font-size:12px;color:#94a3b8;margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e6e9f0}
.th{position:relative;aspect-ratio:16/11;overflow:hidden}
.bd{padding:14px 16px 16px}.c{font-size:10.5px;font-weight:500}.h{font-size:13.5px;font-weight:500;line-height:1.5;margin-top:4px}
.mono{font-family:"JetBrains Mono"}.grid{background-image:linear-gradient(rgba(47,70,240,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(47,70,240,.06) 1px,transparent 1px);background-size:16px 16px}
.ln{height:3px;border-radius:2px;background:#e3e7ef}</style></head><body><div id="cmp"></div><script>
const D=[{k:'サービス資料',t:'EngageLab<br>サービス紹介資料',c:'#2f46f0',l:'#eef1ff',m:'#c9d0ff',ty:'el'},{k:'導入事例集',t:'業種別<br>導入事例集 2026',c:'#0f9aa0',l:'#e6f6f5',m:'#b5e3e1',ty:'cs'}];
const svgLine=(c,w=200,h=60)=>'<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:100%;display:block"><defs><linearGradient id="g'+c.slice(1)+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c+'" stop-opacity=".22"/><stop offset="1" stop-color="'+c+'" stop-opacity="0"/></linearGradient></defs><path d="M0 48 L28 42 L56 44 L84 30 L112 33 L140 20 L168 22 L200 8 L200 60 L0 60Z" fill="url(#g'+c.slice(1)+')"/><polyline points="0,48 28,42 56,44 84,30 112,33 140,20 168,22 200,8" fill="none" stroke="'+c+'" stroke-width="2" stroke-linejoin="round"/><circle cx="200" cy="8" r="3.5" fill="'+c+'"/></svg>';
const ln=(w,o=1)=>'<div style="height:4px;width:'+w+'%;border-radius:2px;background:#e3e7ef;opacity:'+o+'"></div>';
// main UI panel per type
function ui(d,s=1){if(d.ty==='el')return '<div style="display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid #eef0f5"><i style="width:5px;height:5px;border-radius:50%;background:#f3b4b4"></i><i style="width:5px;height:5px;border-radius:50%;background:#f5d9a3"></i><i style="width:5px;height:5px;border-radius:50%;background:#b8e3c4"></i><span class="mono" style="margin-left:6px;font-size:7px;color:#94a3b8">Delivery Report</span></div><div style="padding:10px 12px"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">'+['到達率','開封率','CV'].map((x,i)=>'<div style="border:1px solid #eef0f5;border-radius:6px;padding:6px 7px"><div style="font-size:6.5px;color:#94a3b8">'+x+'</div><div class="mono" style="font-size:12px;font-weight:500;color:'+(i==0?d.c:'#0b1524')+';margin-top:2px">'+['98.2%','24.6%','3.1%'][i]+'</div></div>').join('')+'</div><div style="height:58px;margin-top:10px">'+svgLine(d.c)+'</div></div>';
return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #eef0f5"><span class="mono" style="font-size:7px;color:#94a3b8">CASE STUDIES / 2026</span><span style="font-size:6.5px;color:'+d.c+';font-weight:700">4 業種</span></div><div style="padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:7px">'+[['小売','M3 7h7v13H3zM14 3h7v17h-7z'],['金融','M3 10l9-6 9 6M5 10v9M19 10v9M9 10v9M15 10v9M3 21h18'],['ゲーム','M6 9h12a3 3 0 013 3v3a3 3 0 01-5 2l-2-2h-4l-2 2a3 3 0 01-5-2v-3a3 3 0 013-3z'],['SaaS','M7 17a4 4 0 010-8 5 5 0 019.6-1.5A3.5 3.5 0 0117 17z']].map(([n,p])=>'<div style="border:1px solid #eef0f5;border-radius:6px;padding:7px;display:flex;gap:7px;align-items:center"><span style="width:20px;height:20px;border-radius:5px;background:'+d.l+';display:grid;place-items:center"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="'+d.c+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+p+'"/></svg></span><div style="flex:1"><div style="font-size:7.5px;font-weight:700">'+n+'</div>'+ln(80,.8)+'</div></div>').join('')+'</div>';}
function chip(d){return d.ty==='el'?'<div style="display:flex;gap:7px;align-items:center;background:#fff;border:1px solid #eef0f5;border-radius:9px;padding:7px 9px;box-shadow:0 12px 24px -12px rgba(15,23,42,.28)"><span style="width:18px;height:18px;border-radius:5px;background:'+d.c+';display:grid;place-items:center;color:#fff;font-size:9px">●</span><div><div style="font-size:7px;font-weight:700">新着キャンペーン</div><div style="font-size:6px;color:#94a3b8">今すぐ確認する</div></div></div>':'<div style="display:flex;gap:7px;align-items:center;background:#fff;border:1px solid #eef0f5;border-radius:9px;padding:7px 9px;box-shadow:0 12px 24px -12px rgba(15,23,42,.28)"><span style="width:18px;height:18px;border-radius:50%;background:'+d.l+';border:1.5px solid '+d.c+'"></span><div><div style="font-size:7px;font-weight:700">導入企業インタビュー</div><div style="font-size:6px;color:#94a3b8">課題・施策・成果</div></div></div>';}
const grid=(d,o='.06')=>'background-color:'+d.l+';background-image:linear-gradient('+d.c+'0f 1px,transparent 1px),linear-gradient(90deg,'+d.c+'0f 1px,transparent 1px);background-size:14px 14px';
const tag=d=>'<span style="align-self:flex-start;font-size:7px;font-weight:700;color:'+d.c+';background:#fff;border-radius:999px;padding:3px 8px">'+d.k+'</span>';
const card=(th,d)=>'<div class="card"><div class="th">'+th+'</div><div class="bd"><div class="c" style="color:'+d.c+'">'+d.k+'</div><div class="h">'+d.t.replace('<br>',' ')+'</div></div></div>';
const V={
V1:['ブリードUI','タイトル左上、大きなUIパネルを右下へはみ出させ、通知カード1枚を重ねる。要素を1か所に集約',d=>'<div style="position:absolute;inset:0;'+grid(d)+'"></div><div style="position:absolute;left:7%;top:10%;display:flex;flex-direction:column;gap:6px;z-index:3">'+tag(d)+'<div style="font-size:13px;font-weight:700;line-height:1.35">'+d.t+'</div></div><div style="position:absolute;left:30%;top:40%;width:82%;background:#fff;border-radius:10px;border:1px solid #e6e9f0;box-shadow:0 24px 40px -20px rgba(15,23,42,.35);overflow:hidden">'+ui(d)+'</div><div style="position:absolute;left:30%;top:74%;z-index:4">'+chip(d)+'</div><span class="mono" style="position:absolute;left:7%;bottom:7%;font-size:6px;font-weight:700;letter-spacing:.08em;z-index:3">AURORA MOBILE</span>'],
V2:['立体ブック','厚みのある冊子の表紙にサイト共通イラストを描く。資料らしさ＋世界観の統一',d=>'<div style="position:absolute;inset:0;'+grid(d)+'"></div><div style="position:absolute;left:50%;bottom:9%;width:56%;height:12px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(15,23,42,.28),transparent);filter:blur(3px)"></div><div style="position:absolute;left:24%;top:9%;width:52%;bottom:13%;transform:perspective(600px) rotateY(-14deg);transform-origin:left;"><div style="position:absolute;left:-7px;top:2px;bottom:2px;width:8px;background:linear-gradient(90deg,'+d.c+','+d.c+'cc);border-radius:2px 0 0 2px"></div><div style="position:absolute;inset:0;background:#fff;border-radius:2px 5px 5px 2px;box-shadow:inset 6px 0 8px -6px rgba(0,0,0,.25);overflow:hidden"><div style="background:'+d.c+';padding:9% 9% 8%;color:#fff"><div class="mono" style="font-size:5.5px;font-weight:700;letter-spacing:.08em;opacity:.85">AURORA MOBILE</div><div style="font-size:10px;font-weight:700;line-height:1.3;margin-top:5px">'+d.t+'</div></div><div style="position:absolute;left:8%;right:-14%;top:44%;background:#fff;border:1px solid #e6e9f0;border-radius:6px;transform:scale(.68);transform-origin:left top;box-shadow:0 10px 20px -12px rgba(15,23,42,.3)">'+ui(d)+'</div><div style="position:absolute;left:8%;bottom:6%;transform:scale(.8);transform-origin:left bottom">'+chip(d)+'</div></div></div>'],
V3:['レイヤースタック','3枚のパネルを奥行きで重ね、前面に主UI。カラーグラデ地で量感を出す',d=>'<div style="position:absolute;inset:0;background:linear-gradient(140deg,'+d.l+','+d.m+')"></div><div style="position:absolute;right:-10%;top:-20%;width:70%;aspect-ratio:1;border-radius:50%;border:1px solid #ffffff99"></div><div style="position:absolute;right:4%;top:-6%;width:46%;aspect-ratio:1;border-radius:50%;border:1px solid #ffffff99"></div><div style="position:absolute;left:7%;top:10%;display:flex;flex-direction:column;gap:6px;z-index:3">'+tag(d)+'<div style="font-size:13px;font-weight:700;line-height:1.35">'+d.t+'</div></div><div style="position:absolute;left:50%;top:30%;width:46%;height:56%;background:#ffffffa0;border-radius:10px;transform:rotate(4deg)"></div><div style="position:absolute;left:45%;top:35%;width:50%;height:56%;background:#ffffffcc;border-radius:10px;transform:rotate(2deg)"></div><div style="position:absolute;left:38%;top:42%;width:58%;background:#fff;border-radius:10px;box-shadow:0 24px 40px -18px rgba(15,23,42,.4);overflow:hidden;transform:scale(.95);transform-origin:left top">'+ui(d)+'</div><span class="mono" style="position:absolute;left:7%;bottom:7%;font-size:6px;font-weight:700;letter-spacing:.08em">AURORA MOBILE</span>'],
V4:['カラーフィールド','ブランド色の面に白い線画UIを大きく。下帯に白地のタイトル。遠目でも識別できる',d=>'<div style="position:absolute;left:0;right:0;top:0;height:66%;background:'+d.c+';overflow:hidden"><div style="position:absolute;inset:0;background-image:linear-gradient(#ffffff14 1px,transparent 1px),linear-gradient(90deg,#ffffff14 1px,transparent 1px);background-size:14px 14px"></div><div style="position:absolute;left:12%;right:12%;top:16%;background:#fff;border-radius:10px 10px 0 0;bottom:-2px;overflow:hidden;box-shadow:0 -10px 30px -10px rgba(0,0,0,.25)">'+ui(d)+'</div><div style="position:absolute;right:6%;top:10%">'+chip(d)+'</div></div><div style="position:absolute;left:0;right:0;bottom:0;height:34%;background:#fff;padding:5% 7%;display:flex;justify-content:space-between;align-items:flex-end"><div style="font-size:12px;font-weight:700;line-height:1.35">'+d.t+'</div><span class="mono" style="font-size:6px;font-weight:700;letter-spacing:.08em">AURORA MOBILE</span></div>']};
document.getElementById('cmp').innerHTML=Object.entries(V).map(([id,[n,r,f]])=>'<div id="'+id+'"><div class="lab">'+id+'<small>'+n+'</small></div><div class="ref">'+r+'</div><div class="row">'+D.map(d=>card(f(d),d)).join('')+'</div></div>').join('');
</script></body></html>
