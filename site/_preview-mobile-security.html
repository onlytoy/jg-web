<section class="sec"><div class="mcd-h"><em>01</em>認証</div><h2 style="margin-top:12px">認証とコンプライアンス</h2><p class="ld">第三者機関による評価と、各国データ保護法への対応状況を公開しています。</p>

<section class="sec" style="background:#f7f9ff"><div class="mcd-h"><em>02</em>データの保管</div><h2 style="margin-top:12px">お預かりしたデータは、<br>どこに保管されるのか。</h2>

<section class="sec"><div class="mcd-h"><em>03</em>安全管理措置</div><h2 style="margin-top:12px">日常的に実施している<br>安全管理措置</h2><p class="ld">個人情報保護法が求める安全管理措置の区分に沿って記載しています。</p>
<div class="msc-ms">
<div><em>01</em><div><b>組織的安全管理措置</b><p>責任者の設置、取扱規程の整備、定期的な内部監査と点検を実施しています。</p></div></div>
<div><em>02</em><div><b>人的安全管理措置</b><p>全従業員との秘密保持契約、年次のセキュリティ教育を実施しています。</p></div></div>

<section class="sec" style="background:#f7f9ff"><div class="mcd-h"><em>04</em>国内サポート</div><h2 style="margin-top:12px">導入後も、<br>日本国内で対応します。</h2><p class="ld">調達・法務のご担当者様からよくいただくご確認事項にお答えします。</p>
<div class="msc-qa">
<details open><summary><i>Q</i>契約はどこと結ぶことになりますか。</summary><div class="an">日本法人「Aurora Mobile株式会社」（東京都港区虎ノ門）が契約主体です。契約書・注文書は日本語、日本法準拠。請求書払い・国内口座でのお支払いに対応しています。<div class="tg"><span>日本語・日本法準拠</span><span>請求書払い可</span></div></div></details>
<details><summary><i>Q</i>日常の問い合わせは日本語で対応してもらえますか。</summary><div class="an">日本語で承ります。受付時間は平日 9:30 – 18:00（土日祝を除く）、初回応答の目安は◯営業時間以内です。導入前の技術相談にも日本語で対応します。<div class="tg"><span>平日 9:30 – 18:00</span><span>フォーム／メール</span></div></div></details>
<details><summary><i>Q</i>障害が起きたとき、報告はどのような形で受けられますか。</summary><div class="an">障害状況はステータスページで公開し、影響範囲・原因・再発防止策をまとめた報告書を日本語で、規定の期間内にご提出します。<div class="tg"><span>ステータスページ公開</span><span>日本語の報告書</span></div></div></details>
<details><summary><i>Q</i>海外の拠点や委託先でも、データを取り扱うことはありますか。</summary><div class="an">対象サービスのデータは日本国内に保管し、国外への移送は行いません。海外の拠点・委託先で取り扱いが生じる場合は、その国の個人情報保護制度を把握したうえで必要な安全管理措置を講じます（外的環境の把握）。<div class="tg"><span>国外移送なし</span><span>外的環境の把握</span></div></div></details>
</div></section>
<div class="cta" data-mcta><small>CONTACT</small><h2>セキュリティチェックシート、<br>当社で記入いたします。</h2><p>導入審査に必要な質問票は、貴社所定の書式に合わせてご記入のうえご返送します。DPA や消去証明など、稟議・調達手続きに必要な書類もご用意いたします。</p><div class="bt"><a class="btn w" href="resources.html">セキュリティ資料をダウンロード</a><a class="btn o" href="contact.html">セキュリティ評価のご相談</a></div></div></template><script src="mobile.js"></script><style id="rgnSoft">html body .jp{border:1px solid #e3e8f3!important;box-shadow:0 8px 24px -14px rgba(15,30,80,.14)!important}</style></body></html>
