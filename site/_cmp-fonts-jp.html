<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&family=M+PLUS+2:wght@300;400;500;700&family=IBM+Plex+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eef1f7;color:#0a1324;-webkit-font-smoothing:antialiased}
#cmp{width:1400px;padding:48px;display:grid;grid-template-columns:repeat(2,1fr);gap:28px;box-sizing:border-box}
.c{background:#fff;border-radius:20px;padding:44px 48px 48px;border:1px solid #e3e8f3}
.lab{font-family:'IBM Plex Sans JP',sans-serif;display:flex;justify-content:space-between;align-items:baseline;padding-bottom:18px;margin-bottom:32px;border-bottom:1px solid #eef1f7}
.lab b{font-size:15px;font-weight:600;letter-spacing:.02em}.lab span{font-size:12px;color:#8a909e}
.ey{font-size:13px;font-weight:500;color:#2847fc;display:flex;align-items:center;gap:10px}.ey i{width:28px;height:3px;border-radius:2px;background:linear-gradient(90deg,#2847fc,#3fd6c4)}
h1{margin:16px 0 0;font-size:40px;font-weight:700;line-height:1.45;letter-spacing:.02em;font-feature-settings:'palt'}
h1 em{font-style:normal;color:#2847fc}
.ld{margin-top:18px;font-size:16px;line-height:1.95;color:#5b6172;letter-spacing:.04em}
h3{margin:32px 0 0;font-size:20px;font-weight:700;line-height:1.5;letter-spacing:.02em}
p{margin:10px 0 0;font-size:14px;line-height:1.95;color:#5b6172;letter-spacing:.04em}
.row{margin-top:28px;display:flex;align-items:center;gap:14px}
.btn{height:48px;padding:0 28px;border-radius:999px;background:#2847fc;color:#fff;font-size:15px;font-weight:700;display:inline-flex;align-items:center;letter-spacing:.04em}
.btn2{height:48px;padding:0 26px;border-radius:999px;border:1px solid #d7dcea;color:#2847fc;font-size:15px;font-weight:700;display:inline-flex;align-items:center;letter-spacing:.04em}
.w{margin-top:26px;display:flex;gap:18px;font-size:22px;color:#0a1324}.w span:nth-child(1){font-weight:300}.w span:nth-child(2){font-weight:400}.w span:nth-child(3){font-weight:500}.w span:nth-child(4){font-weight:700}
</style></head><body><div id="cmp">
<script>
const F=[['Zen Kaku Gothic New','A　Zen Kaku Gothic New','现在在用'],['Noto Sans JP','B　Noto Sans JP','标准・稳妥'],['M PLUS 2','C　M PLUS 2','现代・几何'],['IBM Plex Sans JP','D　IBM Plex Sans JP','推荐・B2B 科技']];
document.write(F.map(([f,n,s])=>`<div class="c"><div class="lab"><b>${n}</b><span>${s}</span></div><div style="font-family:'${f}',sans-serif">
<div class="ey"><i></i>選ばれる理由</div>
<h1>グローバルの技術力と、<br><em>日本品質のサポート</em>を両立</h1>
<div class="ld">先進テクノロジーだけでなく、日本市場に根ざした信頼できるパートナーとして企業のDXを支えます。</div>
<h3>エンタープライズ品質のセキュリティ</h3>
<p>国際基準に準拠したセキュリティ体制で、お客様の大切なデータを安全に管理します。ISO 27001・SOC 2 取得済み。</p>
<div class="row"><span class="btn">資料ダウンロード →</span><span class="btn2">お問い合わせ</span></div>
<div class="w"><span>細 300</span><span>標準 400</span><span>中 500</span><span>太 700</span></div>
</div></div>`).join(''));
</script></div></body></html>
