<h1>日本市場向けサポート体制の<br>拡充について</h1>
<div class="md-by"><b>Aurora Mobile株式会社</b><span>東京都港区</span></div></div>
<div class="md-ph"><img src="img/news-detail-main.png" alt=""></div>
<p class="md-lead">Aurora Mobile株式会社は、日本国内のお客様へのサポート品質をさらに高めるため、国内サポート体制を拡充いたしました。日本語による技術サポートの対応時間を拡大し、導入から運用までを一貫して支援します。</p>
<div class="md-body"><h2>拡充の背景</h2><p>近年、EngageLab・GPTBots.ai をはじめとする当社サービスを導入いただく国内企業が増加しています。それに伴い、導入時の設計支援や運用中の迅速な問い合わせ対応へのご要望が高まっていました。</p><p>今回の拡充では、次の取り組みを行います。</p><ul><li>日本語サポート窓口の対応時間を平日 9:00〜20:00 に拡大</li><li>導入支援を担うカスタマーサクセス担当の増員</li><li>国内データ保管に関するご相談窓口の新設</li></ul><h2>今後について</h2><p>当社は今後も、日本のお客様の事業成長に寄り添うパートナーとして、サービスとサポートの両面から品質向上に取り組んでまいります。</p>
