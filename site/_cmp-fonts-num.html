<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=Poppins:wght@300;400;500&family=Inter+Tight:wght@300;400;500&family=Outfit:wght@300;400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eef1f7;color:#0a1324;-webkit-font-smoothing:antialiased;font-family:'IBM Plex Sans JP',sans-serif}
#cmp{width:1400px;padding:48px;display:grid;grid-template-columns:repeat(2,1fr);gap:28px;box-sizing:border-box}
.c{background:#fff;border-radius:20px;padding:40px 48px 44px;border:1px solid #e3e8f3}
.lab{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:16px;margin-bottom:30px;border-bottom:1px solid #eef1f7}
.lab b{font-size:15px;font-weight:600}.lab span{font-size:12px;color:#8a909e}
.st{display:grid;grid-template-columns:repeat(3,1fr)}.st>div{padding-left:20px;border-left:1px solid #e6e9f2}.st>div:first-child{padding-left:0;border:0}
.st b{display:block;font-size:46px;line-height:1;letter-spacing:-.01em}.st small{display:block;margin-top:12px;font-size:13px;color:#5b6172}
.cs{margin-top:34px;display:flex;align-items:baseline;gap:14px}.cs b{font-size:64px;line-height:1;color:#2847fc}.cs span{font-size:15px;font-weight:600}
.mx{margin-top:28px;font-size:15px;line-height:1.9;color:#5b6172}.mx em{font-style:normal}
</style></head><body><div id="cmp">
<script>
const F=[['IBM Plex Sans JP',400,300,'A　IBM Plex Sans JP（日文同款数字）','不另设字体，最统一'],['IBM Plex Sans',400,300,'B　IBM Plex Sans','同家族英文版，推荐'],['Poppins',400,300,'C　Poppins','现在首页在用，偏圆'],['Inter Tight',400,300,'D　Inter Tight','紧凑・现代'],['Outfit',400,300,'E　Outfit','几何・轻盈'],['DM Sans',400,300,'F　DM Sans','柔和・简洁']];
document.write(F.map(([f,w,w2,n,s])=>`<div class="c"><div class="lab"><b>${n}</b><span>${s}</span></div>
<div class="st" style="font-family:'${f}',sans-serif"><div><b style="font-weight:${w}">200+</b><small style="font-family:'IBM Plex Sans JP'">対応国・地域</small></div><div><b style="font-weight:${w}">12B+</b><small style="font-family:'IBM Plex Sans JP'">1日あたりの配信数</small></div><div><b style="font-weight:${w}">99.97%</b><small style="font-family:'IBM Plex Sans JP'">メッセージ到達率</small></div></div>
<div class="cs"><b style="font-family:'${f}';font-weight:${w2}">+35%</b><span>リピート購入率が向上</span></div>
<div class="mx">東京を含む世界<em style="font-family:'${f}'">7</em>つのデータノード、累計<em style="font-family:'${f}'">2,000</em>社以上・<em style="font-family:'${f}'">2026.04.15</em> 更新</div>
</div>`).join(''));
</script></div></body></html>
