 const band=(off,col,amp,w)=>{x.save();x.globalCompositeOperation='multiply';for(let t=0;t<=WW;t+=1.5){const y=HH*(.34+off)+Math.sin(t/26+k*.9+off*9)*amp+Math.sin(t/11+k*1.6)*amp*.25;const g=x.createLinearGradient(0,y-w,0,y+6);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.8,col);g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(t,y-w,1.6,w+6)}x.restore()};
 band(0,'rgba(150,200,215,.55)',10,30);band(.1,'rgba(170,160,230,.5)',8,24);band(-.06,'rgba(214,188,230,.35)',6,18);

 x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.moveTo(WW*.56,HH*.5);x.lineTo(WW*.5,HH*.57);x.lineTo(WW*.54,HH*.56);x.lineTo(WW*.57,HH*.6);x.lineTo(WW*.61,HH*.555);x.fill();x.beginPath();x.moveTo(WW*.22,HH*.56);x.lineTo(WW*.18,HH*.6);x.lineTo(WW*.25,HH*.59);x.fill();
